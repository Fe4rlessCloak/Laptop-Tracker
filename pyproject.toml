[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olx-scraper"
version = "0.1.0"
description = "OLX Pakistan laptop scraper (Islamabad/Rawalpindi, recent listings)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
