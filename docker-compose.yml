# docker-compose for the OLX Pakistan laptop scraper and read-only Web UI.
#
# Volume: ``laptop-tracker-data`` uses an explicit literal name so Compose and
# the Ubuntu systemd timer (deploy/systemd/olx-scraper.service) share the exact
# same host volume instead of creating a project-prefixed copy.
#
# Typical usage:
#   # Start the persistent read-only Web UI (binds 127.0.0.1:8000 by default;
#   # set WEB_BIND_HOST in .env to your LAN or Tailscale IP on the mini PC):
#   docker compose up -d
#
#   # Run a one-shot scrape manually:
#   docker compose run --rm scraper --hours 24 --export csv json

services:
  scraper:
    # The image pushed by .github/workflows/release.yml. The Ubuntu
    # systemd timer always pulls :latest so a fresh release is picked up
    # on the next scheduled run.
    image: ghcr.io/fe4rlesscloak/laptop-tracker:latest
    pull_policy: always
    profiles: ["scraper"]
    # Default command; override per-invocation (see ``Typical usage`` above).
    command: ["--hours", "24", "--export", "csv", "json"]
    volumes:
      - laptop-tracker-data:/app/data

  web:
    # Reuses the same published image with the read-only Web UI entrypoint.
    image: ghcr.io/fe4rlesscloak/laptop-tracker:latest
    pull_policy: always
    entrypoint: ["python", "-m", "scraper.web"]
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8000",
        "--db", "/app/data/olx.db",
        "--monitoring-db", "/app/data/monitoring.db",
      ]
    ports:
      # Safe loopback default — set WEB_BIND_HOST to your private LAN or
      # Tailscale IP (never wildcard 0.0.0.0 on an untrusted network).
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    volumes:
      - laptop-tracker-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  laptop-tracker-data:
    name: laptop-tracker-data
    # Literal named volume shared with deploy/systemd/olx-scraper.service.
    # Survives container restarts and ``docker compose down``.
